<VirtualHost *:80>
    ServerName mini-kbp.site
    ServerAlias www.mini-kbp.site lk.mini-kbp.site panel.mini-kbp.site api.mini-kbp.site localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/app/public

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # SEO: robots / dynamic sitemap / llms.txt caching hint
    <LocationMatch "^/(robots\.txt|sitemap\.xml|llms\.txt)$">
        Header set Cache-Control "public, max-age=3600, must-revalidate"
    </LocationMatch>
    <LocationMatch "^/og-default\.png$">
        Header set Cache-Control "public, max-age=86400"
    </LocationMatch>

    # Private-ish hosts on same PHP app: discourage indexing of API-ish paths
    <LocationMatch "^/api/">
        Header set X-Robots-Tag "noindex, nofollow"
        Header set Cache-Control "no-store"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
